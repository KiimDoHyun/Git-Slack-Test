name: Fetch Slack User Info

on:
  workflow_dispatch: # 사용자가 수동으로 실행할 수 있도록 설정

jobs:
  fetch-user-info:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v2

    - name: Setup Node.js
      uses: actions/setup-node@v2
      with:
        node-version: '18' # Node.js 버전을 설정합니다.

    - name: Install dependencies
      run: npm install

    - name: Run script to fetch Slack user info
      run: node .github/scripts/get_slack_user_info.js
      env:
        SLACK_TOKEN: ${{ secrets.SLACK_API_TOKEN }} # Slack 토큰을 GitHub Secrets에 저장한 후 사용