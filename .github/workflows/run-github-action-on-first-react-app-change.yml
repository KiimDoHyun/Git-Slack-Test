name: Run GitHub Actions Package on First React App Changes

on:
  push:
    paths:
      - 'packages/first-react-app/**'
  pull_request:
    paths:
      - 'packages/first-react-app/**'

jobs:
  run-action:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v2

      - name: Set up Node.js
        uses: actions/setup-node@v2
        with:
          node-version: '18'

      - name: Install pnpm
        uses: pnpm/action-setup@v2.0.1
        with:
          version: 9

      - name: Install dependencies
        run: pnpm install
        working-directory: ./packages/github-actions-package

      - name: Build the action
        run: pnpm run build
        working-directory: ./packages/github-actions-package

      - name: Run the action
        run: node dist/index.js
        working-directory: ./packages/github-actions-package
